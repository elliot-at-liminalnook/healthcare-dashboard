name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/healthcare
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check the models match the migrations
        run: uv run alembic check
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type-check and build
        run: npm run build

  api-client:
    name: Generated API client is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Export the OpenAPI schema from the backend
        working-directory: backend
        run: uv run --locked --no-dev python -m scripts.export_openapi > ../frontend/openapi.json
      - name: Regenerate the typed hooks and Zod schemas
        working-directory: frontend
        run: |
          npm ci
          npm run generate:client
      - name: Fail if the committed client differs
        run: |
          git diff --exit-code -- frontend/openapi.json frontend/src/api/generated || {
            echo "::error::The API changed but the generated client was not updated. Run 'make client' and commit the result."
            exit 1
          }

  e2e:
    name: End-to-end demos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The Grafana stack is not needed here; an empty endpoint turns telemetry export off.
      OTLP_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v7
      - name: Start the app
        run: docker compose up --build --detach --wait db backend frontend
      - name: Run the demo specs and record them
        run: make demos
      - name: Keep the recordings
        uses: actions/upload-artifact@v7
        with:
          name: demo-recordings
          path: docs/demos/*.gif
          if-no-files-found: error
          retention-days: 14
      - name: Show service logs
        if: failure()
        run: docker compose logs --tail 200
